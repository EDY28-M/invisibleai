name: "publish"

on:
  push:
    branches:
      - main

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-latest"
            args: "--target aarch64-apple-darwin --bundles dmg"   # Mac Apple Silicon → solo .dmg
          - platform: "macos-latest"
            args: "--target x86_64-apple-darwin --bundles dmg"     # Mac Intel → solo .dmg
          - platform: "ubuntu-22.04"
            args: "--bundles appimage"                              # Linux → solo .AppImage
          - platform: "windows-latest"
            args: "--bundles nsis"                                  # Windows x64 → solo .exe (NSIS)

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install system deps (Ubuntu)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.0-dev libwebkit2gtk-4.1-dev \
            librsvg2-dev patchelf libgtk-3-dev pkg-config \
            libasound2-dev libpulse-dev fuse libfuse2 squashfs-tools \
            xz-utils wget file libglib2.0-dev libgdk-pixbuf2.0-dev libcairo-gobject2 \
            libayatana-appindicator3-dev ca-certificates binutils
          sudo update-ca-certificates -f

      - name: Create environment file
        run: |
          # .env del frontend (raíz) → Vite lo lee al compilar
          echo "VITE_INVISIBLEAI_SERVER=${{ secrets.VITE_INVISIBLEAI_SERVER || 'https://serverai.keraai.online' }}" > .env
          # .env del backend Rust (src-tauri) — fallbacks hardcodeados si el secret está vacío
          echo "API_ACCESS_KEY=${{ secrets.API_ACCESS_KEY }}" > src-tauri/.env
          echo "PAYMENT_ENDPOINT=${{ secrets.PAYMENT_ENDPOINT || 'https://serverai.keraai.online/api' }}" >> src-tauri/.env
          echo "APP_ENDPOINT=${{ secrets.APP_ENDPOINT || 'https://serverai.keraai.online' }}" >> src-tauri/.env
          echo "POSTHOG_API_KEY=${{ secrets.POSTHOG_API_KEY }}" >> src-tauri/.env

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build & publish
        uses: tauri-apps/tauri-action@v0.5.16
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          VITE_INVISIBLEAI_SERVER: ${{ secrets.VITE_INVISIBLEAI_SERVER }}
        with:
          tagName: app-v__VERSION__
          releaseName: "InvisibleAI v__VERSION__"
          releaseBody: |
            ### InvisibleAI v__VERSION__

            * **Límites ampliados**: Chat licensed sube a 700 000 tokens/período con reset cada 12 h. Créditos Deepgram: 20 000/día (máx. 40 000 acumulables). Bono bienvenida día 1: 23 600 créditos.
            * **Fuga de créditos corregida**: Los créditos de streaming ya no se consumen cuando el usuario no está hablando. La facturación ahora se activa únicamente cuando hay actividad de audio real (con 5 s de gracia tras el último audio detectado).
            * **Idioma de respuesta corregido**: Al seleccionar un idioma en ajustes, la IA ahora responde siempre en ese idioma. Antes ignoraba la selección y seguía contestando en otro idioma.
            * **Reset de chat cada 12 horas**: Los 700 000 tokens del tier licensed se recargan dos veces al día (00:00 UTC y 12:00 UTC) en lugar de una vez a medianoche.
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
          args: ${{ matrix.args }}
