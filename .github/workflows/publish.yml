name: "publish"

on:
  push:
    branches:
      - main

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-latest"
            args: "--target aarch64-apple-darwin"
          - platform: "macos-latest"
            args: "--target x86_64-apple-darwin"
          - platform: "ubuntu-22.04"
            args: ""
          - platform: "windows-latest"
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install system deps (Ubuntu)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.0-dev libwebkit2gtk-4.1-dev \
            librsvg2-dev patchelf libgtk-3-dev pkg-config \
            libasound2-dev libpulse-dev fuse libfuse2 squashfs-tools \
            xz-utils wget file libglib2.0-dev libgdk-pixbuf2.0-dev libcairo-gobject2 \
            libayatana-appindicator3-dev ca-certificates binutils
          sudo update-ca-certificates -f

      - name: Create environment file
        run: |
          echo "API_ACCESS_KEY=${{ secrets.API_ACCESS_KEY }}" > src-tauri/.env
          echo "PAYMENT_ENDPOINT=${{ secrets.PAYMENT_ENDPOINT }}" >> src-tauri/.env
          echo "APP_ENDPOINT=${{ secrets.APP_ENDPOINT }}" >> src-tauri/.env
          echo "POSTHOG_API_KEY=${{ secrets.POSTHOG_API_KEY }}" >> src-tauri/.env

      - name: Install frontend deps
        run: npm ci

      - name: Build & publish
        uses: tauri-apps/tauri-action@v0.5.16
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: app-v__VERSION__
          releaseName: "InvisibleAI v__VERSION__"
          releaseBody: |
            ### 🎉 Lanzamiento Oficial: InvisibleAI v1.0.0
            
            ¡Bienvenido a la primera versión oficial de InvisibleAI! Esta actualización establece la arquitectura principal e introduce todas las funciones core que hacen a este asistente único.
            
            * **🛡️ Modo Sigilo (Stealth Mode):** La aplicación se vuelve completamente invisible para grabaciones de pantalla, capturas y software de monitoreo (requiere licencia).
            * **🎙️ Reconocimiento de Voz Avanzado:** Transcripción en tiempo real (STT) ultra rápida y privada.
            * **🧠 Asistente de IA Oculto:** Integración nativa con los mejores modelos (OpenAI, Claude) para generar respuestas y analizar contexto en tiempo real.
            * **🔐 Privacidad Primero:** Base de datos local (SQLite) integrada. Tus chats, prompts y configuración nunca salen de tu PC.
            * **🎨 Diseño Premium:** Interfaz oscura, elegante, con tipografía Inter y animaciones fluidas, diseñada para no distraer.
            * **🌐 Bilingüe:** Soporte completo en español e inglés.
            
            ---
            
            **🍏 macOS users:** If the app is blocked from opening, go to `System Settings` > `Privacy & Security` > `Security` section, find the message saying *'invisibleai was blocked'*, click **'Allow Anyway'**, and then reopen the app.
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
          args: ${{ matrix.args }}
