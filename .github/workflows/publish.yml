name: "publish"

on:
  push:
    branches:
      - main

jobs:
  publish-release:
    permissions:
      contents: write
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Get version from package.json
        id: version
        run: echo "VERSION=$(node -p \"require('./package.json').version\")" >> $GITHUB_OUTPUT

      - name: Collect .txt files
        run: |
          mkdir -p release-assets
          find . -maxdepth 2 -name "*.txt" \
            -not -path "./node_modules/*" \
            -not -path "./.git/*" \
            -not -path "./release-assets/*" \
            -exec cp {} release-assets/ \;
          echo "--- Archivos .txt encontrados ---"
          ls -la release-assets/ || echo "No se encontraron archivos .txt"

      - name: Create Release and upload .txt files
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-v${{ steps.version.outputs.VERSION }}
          name: "InvisibleAI v${{ steps.version.outputs.VERSION }}"
          body: |
            ### InvisibleAI v${{ steps.version.outputs.VERSION }}

            * **Cliente API servidor InvisibleAI:** nuevo módulo `server-api.ts` centraliza llamadas al servidor propio, tokens de Deepgram cacheados y configuración remota.
            * **Modo servidor para streaming/STT:** credenciales de Deepgram obtenidas desde el servidor cuando la API está activa, despacho del copiloto reducido a 500ms.
            * **Proveedores bloqueados con API activa:** pantalla Dev Space muestra banner con candado cuando el servidor gestiona la configuración.
            * **Panel de licencia mejorado:** estado actualizado para modo gratuito, colores migrados a zinc neutral.
            * **Paleta 100% neutral:** eliminados los últimos usos de emerald y amber en transcripciones, badges y componentes de UI.
            * **GitHub Actions simplificado:** release sube solo archivos `.txt`, sin compilación de ejecutables.

            ---

            **macOS:** If the app is blocked from opening, go to `System Settings` > `Privacy & Security` > `Security` section, find the message saying *'invisibleai was blocked'*, click **'Allow Anyway'**, and then reopen the app.
          draft: false
          prerelease: false
          files: release-assets/*.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

